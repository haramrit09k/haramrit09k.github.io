name: Node.js CI and Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Install Dependencies
      run: npm install

    - name: Audit production and build dependencies
      run: npm audit --audit-level=high
    
    - name: Build
      run: npm run build
    
    # - name: Test
    #   run: npm test -- --watchAll=false

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for gh-pages to push to branch
    if: github.event_name != 'pull_request'

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        
    - name: Install Dependencies
      run: npm install

    - name: Probe hosted project metrics
      run: npm run metrics:generate
    
    - name: Build
      run: npm run build
    
    - name: Deploy to GitHub Pages
      run: |
        # Set Git identity
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        npm run deploy
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Automatically provided by GitHub
